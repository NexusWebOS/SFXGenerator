# NightCode website: builds coleforge/web/nightcode and deploys it to Netlify (site + functions), so
# nightcode.coletechsystems.com runs NightCode-DOS and the NightCode desktop in any browser.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions > New repository secret):
#   NETLIFY_AUTH_TOKEN            a Netlify personal access token (User settings > Applications)
#   NIGHTCODE_SUPABASE_ANON_KEY   the Supabase project's anon public key (Project Settings > API Keys)
# Optional repository variable NIGHTCODE_NETLIFY_SITE: the Netlify site name (default nightcode-coletech).
name: NightCode website

on:
  workflow_dispatch:
  push:
    paths:
      - "coleforge/web/nightcode/**"
      - "coleforge/shell/**"
      - "coleforge/agent/**"
      - ".github/workflows/nightcode-web.yml"

concurrency:
  group: nightcode-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NIGHTCODE_SUPABASE_ANON_KEY: ${{ secrets.NIGHTCODE_SUPABASE_ANON_KEY }}
      NIGHTCODE_SUPABASE_URL: https://wjfzxeqztbvnrnlgarvn.supabase.co
      SITE_NAME: ${{ vars.NIGHTCODE_NETLIFY_SITE || 'nightcode-coletech' }}
      DOMAIN: nightcode.coletechsystems.com
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "$NETLIFY_AUTH_TOKEN" ] || missing="$missing NETLIFY_AUTH_TOKEN"
          [ -n "$NIGHTCODE_SUPABASE_ANON_KEY" ] || missing="$missing NIGHTCODE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the site
        working-directory: coleforge/web/nightcode
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          node build-config.js
          test -f dist/index.html && test -f dist/config.json && test -f dist/desktop/index.html
          echo "built: $(find dist -type f | wc -l) files"

      - name: Check the Supabase database
        run: |
          code=$(curl -s -o /tmp/sb.json -w '%{http_code}' "$NIGHTCODE_SUPABASE_URL/rest/v1/nc_profiles?select=username&limit=1" \
            -H "apikey: $NIGHTCODE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $NIGHTCODE_SUPABASE_ANON_KEY")
          if [ "$code" = "200" ]; then echo "Supabase: NightCode tables are there."
          elif [ "$code" = "401" ]; then echo "::error::Supabase rejected NIGHTCODE_SUPABASE_ANON_KEY (use the anon public key)."; exit 1
          else echo "::warning::Supabase answered $code for nc_profiles: run both SQL migrations in coleforge/web/nightcode/supabase/migrations (see SETUP.md). $(head -c 200 /tmp/sb.json)"; fi

      - name: Find or create the Netlify site
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" -H "Content-Type: application/json" "$@"; }
          id=$(api "https://api.netlify.com/api/v1/sites?filter=all&per_page=100" | jq -r --arg n "$SITE_NAME" '.[]? | select(.name == $n) | .id' | head -1)
          if [ -z "$id" ]; then
            out=$(api -X POST "https://api.netlify.com/api/v1/sites" -d "{\"name\":\"$SITE_NAME\"}")
            id=$(echo "$out" | jq -r '.id // empty')
            if [ -z "$id" ]; then echo "::error::Couldn't create the Netlify site '$SITE_NAME': $(echo "$out" | head -c 300). Set the repository variable NIGHTCODE_NETLIFY_SITE to another name."; exit 1; fi
            echo "Created Netlify site $SITE_NAME"
          fi
          site=$(api "https://api.netlify.com/api/v1/sites/$id")
          if [ "$(echo "$site" | jq -r '.custom_domain // ""')" != "$DOMAIN" ]; then
            res=$(api -X PATCH "https://api.netlify.com/api/v1/sites/$id" -d "{\"custom_domain\":\"$DOMAIN\"}")
            if [ "$(echo "$res" | jq -r '.custom_domain // ""')" = "$DOMAIN" ]; then echo "Attached $DOMAIN"; else echo "::warning::Couldn't attach $DOMAIN (is it on another Netlify site?): $(echo "$res" | head -c 200)"; fi
          fi
          acct=$(echo "$site" | jq -r '.account_id // .account_slug')
          # The functions (NightOps, Albert) read the anon key at run time too.
          body=$(jq -n --arg v "$NIGHTCODE_SUPABASE_ANON_KEY" '[{key:"NIGHTCODE_SUPABASE_ANON_KEY", scopes:["builds","functions","runtime"], values:[{value:$v, context:"all"}]}]')
          if ! api -f -X POST "https://api.netlify.com/api/v1/accounts/$acct/env?site_id=$id" -d "$body" >/dev/null 2>&1; then
            api -X PUT "https://api.netlify.com/api/v1/accounts/$acct/env/NIGHTCODE_SUPABASE_ANON_KEY?site_id=$id" \
              -d "$(echo "$body" | jq '.[0]')" >/dev/null || echo "::warning::Couldn't set the site's NIGHTCODE_SUPABASE_ANON_KEY (functions may not see it)"
          fi
          echo "SITE_ID=$id" >> "$GITHUB_ENV"
          echo "SITE_URL=$(echo "$site" | jq -r '.ssl_url // .url')" >> "$GITHUB_ENV"

      - name: Deploy to Netlify
        working-directory: coleforge/web/nightcode
        run: |
          npx --yes netlify-cli deploy --prod --dir dist --functions netlify/functions --site "$SITE_ID" \
            --message "GitHub ${GITHUB_SHA::7}" --json > /tmp/deploy.json
          jq '{url, deploy_url, site_name}' /tmp/deploy.json
          # The netlify.app address works right away, whatever the custom domain's DNS says.
          echo "LIVE_URL=https://$(jq -r '.site_name' /tmp/deploy.json).netlify.app" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          for p in / /config.json /desktop/ /css/nightcode-dos.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$LIVE_URL$p"); echo "$p -> $code"
            [ "$code" = "200" ] || { echo "::error::$LIVE_URL$p answered $code"; exit 1; }
          done
          curl -s "$LIVE_URL/config.json" | jq -e '.supabaseUrl and .supabaseAnonKey' >/dev/null
          dns=$(getent hosts "$DOMAIN" | awk '{print $2}' | head -1 || true)
          {
            echo "## NightCode is live"
            echo ""
            echo "- Netlify: **$LIVE_URL**"
            echo "- Custom domain: https://$DOMAIN (DNS now points at: \`${dns:-nothing}\`)"
            echo ""
            echo "If $DOMAIN doesn't open yet, set its DNS record at your DNS host: **CNAME \`nightcode\` → \`$(echo "$LIVE_URL" | sed -E 's#https?://##')\`**. Netlify adds HTTPS once it resolves."
          } >> "$GITHUB_STEP_SUMMARY"
