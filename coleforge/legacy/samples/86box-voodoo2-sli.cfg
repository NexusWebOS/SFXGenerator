# Windows – ColeForge Edition · Legacy Mode · Voodoo2 SLI Monster (1998)
# ASUS P3B-F (Intel 440BX) · Intel Pentium II (Deschutes) 350 MHz · 128 MB · S3 ViRGE (2D) + 2× Voodoo2 12 MB in SLI · Ensoniq AudioPCI ES1371
# Open this folder with: 86Box.exe --vmpath <folder>

[Machine]
machine = p3bf
cpu_family = pentium2_deschutes
cpu_speed = 350000000
cpu_multi = 3.5
mem_size = 131072
cpu_use_dynarec = 1
time_sync = local

[Video]
gfxcard = virge_pci
voodoo = 1

[Input devices]
mouse_type = ps2

[Sound]
sndcard = es1371
midi_device = windows_midi
fm_driver = nuked

[Network]
net_01_card = rtl8139c+
net_01_net_type = slirp

[Storage controllers]
hdc_1 = internal

[Hard disks]
hdd_01_parameters = 63, 16, 8322, 0, ide
hdd_01_fn = ColeForge_98_Voodoo2.img
hdd_01_ide_channel = 0:0

[Floppy and CD-ROM drives]
fdd_01_type = 35_2hd
cdrom_01_parameters = 1, atapi
cdrom_01_ide_channel = 1:0

[3Dfx Voodoo Graphics]
type = voodoo_2
framebuffer_memory = 4
texture_memory = 4
bilinear = 1
render_threads = 4
sli = 1
recompiler = 1
