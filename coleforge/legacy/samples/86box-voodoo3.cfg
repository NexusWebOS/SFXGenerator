# Windows – ColeForge Edition · Legacy Mode · Voodoo3 Rig (1999)
# ASUS P3B-F (Intel 440BX, AGP 2x) · Intel Pentium II (Deschutes) 450 MHz · 128 MB · 3dfx Voodoo3 3000 AGP (16 MB, 166 MHz) · Ensoniq AudioPCI ES1371 (Sound Blaster PCI 128)
# Open this folder with: 86Box.exe --vmpath <folder>

[Machine]
machine = p3bf
cpu_family = pentium2_deschutes
cpu_speed = 450000000
cpu_multi = 4.5
mem_size = 131072
cpu_use_dynarec = 1
time_sync = local

[Video]
gfxcard = voodoo3_3k_agp
voodoo = 0

[Input devices]
mouse_type = ps2

[Sound]
sndcard = es1371
midi_device = windows_midi
fm_driver = nuked

[Network]
net_01_card = rtl8139c+
net_01_net_type = slirp

[Storage controllers]
hdc_1 = internal

[Hard disks]
hdd_01_parameters = 63, 16, 8322, 0, ide
hdd_01_fn = ColeForge_98_Voodoo3.img
hdd_01_ide_channel = 0:0

[Floppy and CD-ROM drives]
fdd_01_type = 35_2hd
cdrom_01_parameters = 1, atapi
cdrom_01_ide_channel = 1:0

[3dfx Voodoo3 3000]
bilinear = 1
dithersub = 1
render_threads = 4
recompiler = 1
