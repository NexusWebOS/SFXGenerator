# DOSBox – ColeForge Edition
# Machine: 486DX2-66 SVGA (1993) · Intel 486DX2 @ 66 MHz · S3 Trio64 (SVGA/VESA) · Sound Blaster 16 + General MIDI
# Game: DOOM
# Generated by Windows – ColeForge Edition Legacy Mode. Load with: dosbox --conf <this file>

[sdl]
fullscreen = false

[dosbox]
machine = svga_s3
memsize = 16

[cpu]
core = auto
cputype = 486
cpu_cycles = 25000
cpu_cycles_protected = auto

[sblaster]
sbtype = sb16
oplmode = opl3

[gus]
gus = false

[voodoo]
voodoo = false

[ipx]
ipx = false

[autoexec]
mount c "C:\Games\DOOM"
c:
DOOM.EXE
exit
