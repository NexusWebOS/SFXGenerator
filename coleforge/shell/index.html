<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows – ColeForge Edition</title>
<link rel="icon" href="assets/cursors/arrow.svg">
<link rel="stylesheet" href="css/forge.css">
<link rel="stylesheet" href="css/apps.css">
<link rel="stylesheet" href="css/theme98.css">
<link rel="stylesheet" href="css/schemes98.css">
<link rel="stylesheet" href="css/nightcode.css">
<link rel="stylesheet" href="css/nightapps.css">
</head>
<body class="forge-cursors">
  <div id="desktop">
    <div id="desk-brand">
      <div class="w">Windows<sup style="font-size:14px">®</sup></div>
      <div class="e">ColeForge Edition</div>
      <div class="t">NIGHTCODE · CODE BEYOND THE LIGHT</div>
    </div>
    <div id="icons"></div>
    <div id="rubber"></div>
  </div>

  <div id="start-menu" role="menu"></div>

  <div id="taskbar">
    <button id="start-btn" title="Click here to begin"><img alt="">Start</button>
    <div id="quick">
      <img data-app="browser" data-icon="browser" alt="Forge Browser" title="Forge Browser" class="clickable">
      <img data-app="files" data-icon="documents" alt="My Documents" title="My Documents" class="clickable">
      <img data-app="forgeamp" data-icon="forgeamp" alt="ForgeAmp" title="ForgeAmp" class="clickable">
      <img data-app="forgechat" data-icon="forgechat" alt="ForgeChat" title="ForgeChat" class="clickable">
    </div>
    <div id="tasks"></div>
    <div id="tray"></div>
  </div>

  <div id="toasts"></div>

  <script src="js/icons.js"></script>
  <script src="js/nightcode-rain.js"></script>
  <script src="js/core.js"></script>
  <script src="js/screensaver.js"></script>
  <script src="js/midi.js"></script>
  <script src="js/zipkit.js"></script>
  <script src="js/forgechat-protocol.js"></script>
  <script src="js/legacy-profiles.js"></script>
  <script src="js/apps/system.js"></script>
  <script src="js/apps/browser.js"></script>
  <script src="js/apps/forgeamp.js"></script>
  <script src="js/apps/forgevision.js"></script>
  <script src="js/apps/forgecraft.js"></script>
  <script src="js/apps/forgechat.js"></script>
  <script src="js/apps/arcade.js"></script>
  <script src="js/apps/gamebrowser.js"></script>
  <script src="js/apps/legacy.js"></script>
  <script src="js/apps/nightcode-programs.js"></script>
  <script src="js/apps/winnight.js"></script>
  <script src="js/apps/nightbrowser.js"></script>
  <script src="js/apps/nightamp.js"></script>
</body>
</html>
