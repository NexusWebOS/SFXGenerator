# nightcode.coletechsystems.com
# Netlify: New site from Git > NexusWebOS/SFXGenerator, base directory coleforge/web/nightcode.
# Environment variables: NIGHTCODE_SUPABASE_URL, NIGHTCODE_SUPABASE_ANON_KEY (see SETUP.md).
[build]
  command = "node build-config.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Only the site itself is published; the backend source stays out.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build-config.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sync-shell.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SETUP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/config.example.js"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"

[[headers]]
  for = "/config.*"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"
