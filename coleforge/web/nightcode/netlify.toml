# nightcode.coletechsystems.com
# Netlify: New site from Git > NexusWebOS/SFXGenerator, base directory coleforge/web/nightcode.
# Environment variables: NIGHTCODE_SUPABASE_ANON_KEY (and, for NightOps, GITHUB_TOKEN, NETLIFY_API_TOKEN).
# See SETUP.md.
[build]
  command = "node build-config.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NIGHTCODE_SUPABASE_URL = "https://wjfzxeqztbvnrnlgarvn.supabase.co"
  NIGHTCODE_SITE_URL = "https://nightcode.coletechsystems.com/"
  NIGHTOPS_GITHUB_OWNER = "NexusWebOS"

# Only the site itself is published; the backend source and build scripts stay out.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build-config.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sync-shell.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SETUP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/config.example.js"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# NightCode-DOS: nothing but its own files and Supabase.
[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"

# The desktop is a whole OS: NightBrowser frames other sites, NightAmp streams radio, WinNight runs
# WebAssembly, ForgeChat uses the camera.
[[headers]]
  for = "/desktop/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; font-src 'self' data:; connect-src * data: blob:; frame-src * data: blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/desktop/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.*"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"
